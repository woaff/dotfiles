version: 2

tools:
    cds-eslint: &cds-eslint
        lint-command: 'eslint --stdin --stdin-filename ${INPUT}'
        lint-stdin: true
        lint-ignore-exit-code: true
        lint-after-open: true
        lint-formats:
            - '%+P%f'
            - '%*[ ]%l:%c%*[ ]%t%*[^ ]%*[ ]%m'
            - '%-O'

    golangci-lint: &golangci-lint
        lint-command: 'golangci-lint run ${INPUT}'
        lint-stdin: true

    javascript-eslint: &javascript-eslint
        lint-command: 'eslint --stdin --stdin-filename ${INPUT}'
        lint-stdin: true
        lint-ignore-exit-code: true
        lint-after-open: true
        lint-formats:
            - '%+P%f'
            - '%*[ ]%l:%c%*[ ]%t%*[^ ]%*[ ]%m'
            - '%-O'

    json-jsonlint: &json-jsonlint
        lint-command: 'jsonlint -c'
        lint-stdin: true

    json-jq: &json-jq
        format-command: 'jq .'
        format-stdin: true

    markdown-markdownlint: &markdown-markdownlint
        lint-command: 'markdownlint -s -c $HOME/.markdownlintrc'
        lint-stdin: true
        lint-formats:
            - '%f:%l %m'
            - '%f:%l:%c %m'
            - '%f: %l: %m'

    prettier: &prettier
        format-command: 'prettier --stdin ${INPUT}'
        format-stdin: true

    python-autopep8: &python-autopep8
        format-command: 'autopep8 -'
        format-stdin: true

    python-pylint: &python-pylint
        lint-command: 'pylint --output-format text --score no --msg-template {path}:{line}:{column}:{C}:{msg} ${INPUT}'
        lint-stdin: true
        lint-formats:
            - '%f:%l:%c:%t:%m'

    sh-shellcheck: &sh-shellcheck
        lint-command: 'shellcheck -f gcc -x'
        lint-source: 'shellcheck'
        lint-formats:
            - '%f:%l:%c: %trror: %m'
            - '%f:%l:%c: %tarning: %m'
            - '%f:%l:%c: %tote: %m'

    sh-shfmt: &sh-shfmt
        format-command: 'shfmt -ci -s -bn'
        format-stdin: true

    toml-taplo: &toml-taplo
        lint-command: 'taplo lint ${INPUT}'
        lint-stdin: true
        format-command: 'taplo format ${INPUT}'
        format-stdin: true

    toml-tombi: &toml-tombi
        lint-command: 'tombi lint ${INPUT}'
        lint-stdin: true

    vim-vint: &vim-vint
        lint-command: 'vint -'
        lint-stdin: true
        lint-formats:
            - '%f:%l:%c: %m'

    yaml-yamllint: &yaml-yamllint
        lint-command: 'yamllint -f parsable -'
        lint-stdin: true

languages:
    cds:
        - <<: *cds-eslint

    css:
        - <<: *prettier

    go:
        - <<: *golangci-lint

    html:
        - <<: *prettier

    javascript:
        - <<: *javascript-eslint
        - <<: *prettier

    json:
        - <<: *json-jsonlint
        - <<: *json-jq

    jsonc:
        - <<: *json-jsonlint
        - <<: *json-jq

    markdown:
        - <<: *markdown-markdownlint

    python:
        - <<: *python-autopep8
        - <<: *python-pylint

    sh:
        - <<: *sh-shellcheck
        - <<: *sh-shfmt

    toml:
        - <<: *toml-taplo

    vim:
        - <<: *vim-vint

    yaml:
        - <<: *yaml-yamllint
